server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dapp_voting?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# Web3j 配置
web3j:
  node-url: http://localhost:8545
  contract-address: "0x67d269191c92Caf3cD7723F116c85e6E9bf55933"

# JWT 配置
jwt:
  secret: dapp-voting-secret-key-change-in-production-2026
  expiration: 86400000

# 日志
logging:
  level:
    com.voting: debug
